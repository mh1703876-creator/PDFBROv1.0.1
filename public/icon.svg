<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  
  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.4" />
  
  <!-- Document Vector Base -->
  <g transform="translate(116, 96)">
    <!-- Main Sheet -->
    <path d="M 30 0 L 190 0 L 250 60 L 250 300 C 250 312 240 320 228 320 L 30 320 C 18 320 8 312 8 300 L 8 20 C 8 8 18 0 30 0 Z" fill="url(#accentGrad)" />
    <!-- Top-Right Fold -->
    <path d="M 190 0 L 190 60 L 250 60 Z" fill="url(#foldGrad)" opacity="0.9" />
    <!-- Content Lines -->
    <rect x="42" y="90" width="130" height="14" rx="7" fill="#FFFFFF" opacity="0.95" />
    <rect x="42" y="125" width="165" height="12" rx="6" fill="#FFFFFF" opacity="0.75" />
    <rect x="42" y="155" width="145" height="12" rx="6" fill="#FFFFFF" opacity="0.75" />
    <rect x="42" y="185" width="170" height="12" rx="6" fill="#FFFFFF" opacity="0.75" />
    
    <!-- Badge Box for PDF -->
    <rect x="36" y="225" width="105" height="45" rx="8" fill="#EF4444" />
    <text x="88" y="256" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" text-anchor="middle" letter-spacing="1.5">PDF</text>
